# R6 gate. Red blocks merge. Needs team agreement before merging (see issue #13).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    # Unit tests + hard Golden cases with the fake model: no key, no network to Groq.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m pytest -m "not llm" -v

  soft:
    # Soft Golden cases and the judge-like set call Groq. They run only when the
    # GROQ_API_KEY secret exists (who adds it is undecided: issue #13); otherwise skip cleanly.
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: No Groq secret, soft cases skipped
        if: env.GROQ_API_KEY == ''
        run: echo "::notice::GROQ_API_KEY secret is not set; soft cases skipped (issue #13)"
      - uses: actions/checkout@v4
        if: env.GROQ_API_KEY != ''
      - uses: actions/setup-python@v5
        if: env.GROQ_API_KEY != ''
        with:
          python-version: "3.12"
      - if: env.GROQ_API_KEY != ''
        run: python -m pip install -e .
      - if: env.GROQ_API_KEY != ''
        run: python -m pytest -m llm -v
